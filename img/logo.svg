<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="128" height="128" rx="28" fill="url(#brand-grad)"/>

  <!-- Subtle inner background circuit backdrop -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#0f141f" opacity="0.92"/>

  <!-- Glowing Infinity Circuit Loops -->
  <g filter="url(#glow)">
    <!-- Outer loop -->
    <path d="M 64 64 C 50 42, 22 42, 22 64 C 22 86, 50 86, 64 64 C 78 42, 106 42, 106 64 C 106 86, 78 86, 64 64 Z"
          fill="none" stroke="url(#brand-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Inner concentric trace -->
    <path d="M 64 64 C 52 49, 32 49, 32 64 C 32 79, 52 79, 64 64 C 76 49, 96 49, 96 64 C 96 79, 76 79, 64 64 Z"
          fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.8" />
  </g>

  <!-- Circuit nodes/pads -->
  <circle cx="22" cy="64" r="4" fill="#00d2ff" />
  <circle cx="22" cy="64" r="1.8" fill="#0f141f" />
  <circle cx="106" cy="64" r="4" fill="#00d2ff" />
  <circle cx="106" cy="64" r="1.8" fill="#0f141f" />

  <circle cx="36" cy="50" r="3" fill="#38bdf8" />
  <circle cx="92" cy="78" r="3" fill="#38bdf8" />

  <!-- Center Microchip -->
  <g transform="translate(64,64)">
    <!-- Chip pins -->
    <line x1="-15" y1="-7" x2="-18" y2="-7" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-15" y1="0" x2="-19" y2="0" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-15" y1="7" x2="-18" y2="7" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    
    <line x1="15" y1="-7" x2="18" y2="-7" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="15" y1="0" x2="19" y2="0" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="15" y1="7" x2="18" y2="7" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>

    <line x1="-7" y1="-15" x2="-7" y2="-18" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="-15" x2="0" y2="-19" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="7" y1="-15" x2="7" y2="-18" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>

    <line x1="-7" y1="15" x2="-7" y2="18" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="15" x2="0" y2="19" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="7" y1="15" x2="7" y2="18" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Chip body -->
    <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#131b2e" stroke="#00d2ff" stroke-width="2" />
    
    <!-- Chip internal circuit symbol -->
    <circle cx="0" cy="0" r="4.5" fill="#00d2ff" />
    <circle cx="-5" cy="-5" r="1.5" fill="#38bdf8" />
    <circle cx="5" cy="5" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Energy Spark / Bolt at top right -->
  <path d="M 86 36 L 95 21 L 91 35 L 101 35 L 89 51 L 92 39 Z"
        fill="url(#brand-grad)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
